<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalProxy</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>本地代理</h1>
      <p class="sub">本地免密代理 → 远端需认证的 HTTP 代理</p>

      <section class="card">
        <label for="bind">本地监听地址</label>
        <input id="bind" value="127.0.0.1:8899" spellcheck="false" />

        <dl class="info">
          <dt>上游代理</dt>
          <dd id="upstream">未加载</dd>
          <dt>上游用户</dt>
          <dd id="user">-</dd>
          <dt>凭据文件</dt>
          <dd id="keypath">-</dd>
        </dl>

        <div class="row">
          <button id="toggle" class="primary">启动</button>
          <button id="reload">重新读取 .key</button>
          <span id="state" class="badge off" role="status" aria-live="polite">已停止</span>
        </div>
        <p id="error" class="error" role="alert"></p>
      </section>

      <section class="card">
        <div class="row space">
          <h2>连接 <span id="counts" class="mono">0 活跃 / 0 累计 / 0 失败</span></h2>
          <button id="clear">清空日志</button>
        </div>
        <pre id="logs" class="logs" aria-label="运行日志"></pre>
      </section>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
